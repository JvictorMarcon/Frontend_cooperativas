<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=logout" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
        rel="stylesheet">
    <title>Recepção de Catadores - Coopersel</title>
</head>

<body class="bg-gray-300 min-h-screen p-4 md:p-8">
    <header
        class="bg-white p-4 w-full md:w-2/3 flex flex-wrap items-center justify-between mt-4 mx-auto rounded-2xl shadow-lg border-b-4 border-blue-700 shadow-xl">
        <div class="flex items-center gap-4">
            <img src="../static/coopersel_logo.png" alt="Logo Coopersel"
                class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 object-contain rounded-2xl hover:scale-105 transition duration-300 ease-in-out shadow-sm">
            <p class="font-merriweather font-semibold text-base sm:text-lg md:text-2xl text-black hidden sm:block">
                Recepção de Catadores
            </p>
        </div>
        <button id="btn-sair"
            class="bg-blue-700 hover:bg-orange-400 hover:scale-105 transition duration-300 ease-in-out text-white font-bold px-6 sm:px-10 py-2 md:py-4 rounded-2xl flex items-center gap-2 text-sm sm:text-base">
            <span class="material-symbols-outlined text-base sm:text-xl">logout</span>
            <span class="hidden sm:inline">Sair</span>
        </button>
    </header>

    <main class="bg-white w-full md:w-2/3 mx-auto mt-4 rounded-2xl shadow-lg border-b-4 border-blue-700 shadow-xl p-8">
        <form id="catador-form" class="flex flex-col gap-5">
            <!-- Material com Autocomplete / Busca -->
            <div class="flex flex-col gap-1">
                <label for="tipo_de_material" class="font-merriweather font-semibold text-gray-700">Tipo de Material (digite para buscar):</label>
                <input list="lista-materiais" id="tipo_de_material" name="tipo_de_material" placeholder="Digite ou selecione o material..." required
                    class="border-2 border-gray-300 rounded-xl px-4 py-2 focus:border-blue-700 focus:outline-none transition duration-300">
                <datalist id="lista-materiais">
                    <option value="alumínio"></option>
                    <option value="arquivo"></option>
                    <option value="bloco"></option>
                    <option value="caixaria"></option>
                    <option value="cobre c/ capa"></option>
                    <option value="cobre mel"></option>
                    <option value="cristal"></option>
                    <option value="latinha"></option>
                    <option value="metal"></option>
                    <option value="motor de geladeira"></option>
                    <option value="motorzinho"></option>
                    <option value="óleo"></option>
                    <option value="panela"></option>
                    <option value="parachoque"></option>
                    <option value="pead"></option>
                    <option value="pead colorido"></option>
                    <option value="pp"></option>
                    <option value="pp branco"></option>
                    <option value="pp preto"></option>
                    <option value="pvc"></option>
                    <option value="sacolinha"></option>
                    <option value="sucata"></option>
                    <option value="terceira"></option>
                    <option value="papelão"></option>
                    <option value="plástico misto"></option>
                    <option value="pet"></option>
                    <option value="pet óleo"></option>
                </datalist>
            </div>

            <!-- Preço por Kg -->
            <div class="flex flex-col gap-1">
                <label for="preco_kg" class="font-merriweather font-semibold text-gray-700">Preço do Material (R$/kg):</label>
                <input type="number" id="preco_kg" name="preco_kg" step="0.01" min="0" placeholder="0,00" required
                    class="border-2 border-gray-300 rounded-xl px-4 py-2 focus:border-blue-700 focus:outline-none transition duration-300">
            </div>

            <!-- Peso -->
            <div class="flex flex-col gap-1">
                <label for="peso" class="font-merriweather font-semibold text-gray-700">Peso (Kg):</label>
                <input type="number" id="peso" name="peso" step="0.01" min="0" placeholder="0,00" required
                    class="border-2 border-gray-300 rounded-xl px-4 py-2 focus:border-blue-700 focus:outline-none transition duration-300">
            </div>

            <!-- Card Destaque: VALOR A PAGAR AO CATADOR -->
            <div class="bg-green-50 border-2 border-green-500 rounded-2xl p-4 flex flex-col items-center justify-center text-center shadow-sm" id="div-preview">
                <span class="text-xs font-bold text-green-700 uppercase tracking-wider font-merriweather">VALOR TOTAL A PAGAR AO CATADOR</span>
                <span class="text-3xl font-bold text-green-900 mt-1 font-merriweather" id="valor-preview">R$ 0,00</span>
            </div>

            <!-- Nome Catador -->
            <div class="flex flex-col gap-1">
                <label for="nome_catador" class="font-merriweather font-semibold text-gray-700">Nome do Catador:</label>
                <input type="text" id="nome_catador" name="nome_catador" placeholder="Digite o nome do catador" required
                    class="border-2 border-gray-300 rounded-xl px-4 py-2 focus:border-blue-700 focus:outline-none transition duration-300">
            </div>

            <!-- Nome Recebedor -->
            <div class="flex flex-col gap-1">
                <label for="recebedor" class="font-merriweather font-semibold text-gray-700">Nome do Recebedor:</label>
                <input type="text" id="recebedor" name="recebedor" placeholder="Digite seu nome" required
                    class="border-2 border-gray-300 rounded-xl px-4 py-2 focus:border-blue-700 focus:outline-none transition duration-300">
            </div>

            <button type="submit"
                class="bg-blue-700 hover:bg-orange-400 hover:scale-105 transition duration-300 ease-in-out text-white font-bold px-10 py-3 rounded-2xl font-merriweather mt-4">
                Registrar Recebimento do Catador
            </button>
        </form>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = sessionStorage.getItem("user");
            const cargo = sessionStorage.getItem("cargo");
            const cooperativa = sessionStorage.getItem("cooperativa");

            // Proteção de rota
            if (!user || (cargo !== "catadores" && cargo !== "adm" && cargo !== "tesoureira")) {
                window.location.href = "../index.html";
                return;
            }
            if (cargo !== "adm" && (cooperativa || "").toLowerCase() !== "coopersel") {
                window.location.href = "../index.html";
                return;
            }

            // Logout
            document.getElementById("btn-sair").addEventListener("click", () => {
                sessionStorage.clear();
                window.location.href = "../index.html";
            });

            // Atualização contínua do valor a receber pelo catador
            const precoInput = document.getElementById("preco_kg");
            const pesoInput = document.getElementById("peso");
            const valorPreview = document.getElementById("valor-preview");

            function atualizarPreview() {
                const preco = parseFloat(precoInput.value) || 0;
                const peso = parseFloat(pesoInput.value) || 0;
                const total = preco * peso;
                valorPreview.textContent = "R$ " + total.toFixed(2).replace(".", ",");
            }

            precoInput.addEventListener("input", atualizarPreview);
            pesoInput.addEventListener("input", atualizarPreview);

            // Submissão
            const form = document.getElementById("catador-form");
            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const tipo_de_material = document.getElementById("tipo_de_material").value.trim().toLowerCase();
                const preco_kg = parseFloat(precoInput.value);
                const peso = parseFloat(pesoInput.value);
                const nome_catador = document.getElementById("nome_catador").value.trim();
                const recebedor = document.getElementById("recebedor").value.trim();
                const valor_total = (preco_kg * peso).toFixed(2).replace(".", ",");

                if (!confirm(`CONFIRMAÇÃO DE PAGAMENTO:\n\nCatador: ${nome_catador}\nMaterial: ${tipo_de_material}\nPeso: ${peso} Kg (R$ ${preco_kg.toFixed(2)}/kg)\n\nVALOR A PAGAR: R$ ${valor_total}`)) {
                    return;
                }

                const submitBtn = e.target.querySelector("button[type='submit']");
                const originalHTML = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = "Enviando...";

                try {
                    const response = await fetch("https://backendcooperativas.vercel.app/recebimento/catador", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            material_tipo: tipo_de_material,
                            preco_kg,
                            peso_total: peso,
                            nome_catador,
                            recebido_por: recebedor,
                            cooperativa: "coopersel"
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error || err.message || "Erro ao registrar");
                    }

                    const result = await response.json();
                    alert(`SUCESSO!\nRecebimento registrado com sucesso.\nValor pago ao catador: R$ ${parseFloat(result.valor_pago).toFixed(2).replace(".", ",")}`);
                    e.target.reset();
                    atualizarPreview();

                } catch (error) {
                    alert("Erro: " + error.message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalHTML;
                }
            });
        });
    </script>
</body>

</html>
