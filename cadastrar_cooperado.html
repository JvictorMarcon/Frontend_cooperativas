<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Cooperado · Itapeva Recicla</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts (Merriweather + Material Symbols) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            font-family: 'Merriweather', serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-md border-b-4 border-blue-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="static/itapeva_recicla_logo.png" alt="Logo Itapeva Recicla"
                    class="w-16 h-16 sm:w-20 sm:h-20 object-contain rounded-xl shadow-md hover:scale-105 transition duration-300">
                <div>
                    <h1 class="font-bold text-lg sm:text-xl text-gray-800 tracking-tight leading-none">Itapeva Recicla</h1>
                    <p class="text-xs text-gray-500 mt-1">Cadastro de Novo Cooperado</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="btn-voltar" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-4 py-2 rounded-xl flex items-center gap-2 text-sm transition">
                    <span class="material-symbols-outlined text-lg">arrow_back</span>
                    <span>Voltar ao Painel</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 sm:px-6 py-8">
        
        <div class="bg-white rounded-2xl shadow-md border border-gray-200 p-6 sm:p-8">
            <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-200">
                <div class="p-3 bg-blue-50 text-blue-700 rounded-xl">
                    <span class="material-symbols-outlined text-2xl">person_add</span>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-gray-800">Cadastrar Novo Cooperado</h2>
                    <p class="text-xs text-gray-500">Preencha os dados do cooperado para inclusão no sistema</p>
                </div>
            </div>

            <!-- Feedback Message Container -->
            <div id="mensagem-container" class="hidden mb-6 p-4 rounded-xl text-sm font-semibold"></div>

            <form id="form-cadastrar-cooperado" class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <!-- Nome Completo -->
                <div class="sm:col-span-2">
                    <label for="nome" class="block text-xs font-semibold text-gray-600 mb-1">Nome Completo *</label>
                    <input type="text" id="nome" required placeholder="Ex: João da Silva"
                        class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:border-blue-700 focus:outline-none transition">
                </div>

                <!-- CPF -->
                <div>
                    <label for="cpf" class="block text-xs font-semibold text-gray-600 mb-1">CPF (11 dígitos, apenas números) *</label>
                    <input type="text" id="cpf" maxlength="11" required placeholder="12345678901"
                        class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:border-blue-700 focus:outline-none transition">
                </div>

                <!-- RG -->
                <div>
                    <label for="rg" class="block text-xs font-semibold text-gray-600 mb-1">RG (7 a 9 dígitos) *</label>
                    <input type="text" id="rg" required placeholder="123456789"
                        class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:border-blue-700 focus:outline-none transition">
                </div>

                <!-- Idade -->
                <div>
                    <label for="idade" class="block text-xs font-semibold text-gray-600 mb-1">Idade *</label>
                    <input type="number" id="idade" min="16" max="100" required placeholder="Ex: 35"
                        class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:border-blue-700 focus:outline-none transition">
                </div>

                <!-- Data de Nascimento -->
                <div>
                    <label for="dt_nascimento" class="block text-xs font-semibold text-gray-600 mb-1">Data de Nascimento *</label>
                    <input type="date" id="dt_nascimento" required
                        class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:border-blue-700 focus:outline-none transition">
                </div>

                <!-- Função -->
                <div>
                    <label for="funcao" class="block text-xs font-semibold text-gray-600 mb-1">Função *</label>
                    <input type="text" id="funcao" required placeholder="Ex: Motorista, Triador, Prensa..."
                        class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:border-blue-700 focus:outline-none transition">
                </div>

                <!-- Telefone -->
                <div>
                    <label for="telefone" class="block text-xs font-semibold text-gray-600 mb-1">Telefone / WhatsApp *</label>
                    <input type="text" id="telefone" required placeholder="11999999999"
                        class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:border-blue-700 focus:outline-none transition">
                </div>

                <!-- Sexo -->
                <div>
                    <label for="sexo" class="block text-xs font-semibold text-gray-600 mb-1">Sexo *</label>
                    <select id="sexo" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:border-blue-700 focus:outline-none transition">
                        <option value="">Selecione...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <!-- Cooperativa -->
                <div>
                    <label for="cooperativa" class="block text-xs font-semibold text-gray-600 mb-1">Cooperativa *</label>
                    <select id="cooperativa" required disabled class="w-full border border-gray-300 bg-gray-100 rounded-xl px-4 py-2.5 text-sm font-bold text-gray-700">
                        <option value="santa maria">Santa Maria</option>
                        <option value="coopersel">Coopersel</option>
                    </select>
                </div>

                <!-- Endereço -->
                <div class="sm:col-span-2">
                    <label for="endereco" class="block text-xs font-semibold text-gray-600 mb-1">Endereço Completo *</label>
                    <input type="text" id="endereco" required placeholder="Rua, número, bairro..."
                        class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:border-blue-700 focus:outline-none transition">
                </div>

                <!-- Botões de Ação -->
                <div class="sm:col-span-2 flex justify-end gap-3 mt-4 pt-4 border-t border-gray-200">
                    <button type="button" id="btn-cancelar" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-6 py-2.5 rounded-xl text-sm transition">
                        Cancelar
                    </button>
                    <button type="submit" id="btn-submit" class="bg-blue-700 hover:bg-blue-800 text-white font-bold px-6 py-2.5 rounded-xl text-sm shadow-md transition flex items-center gap-2">
                        <span class="material-symbols-outlined text-lg">save</span>
                        <span>Cadastrar Cooperado</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Script de validação e envio -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = sessionStorage.getItem("user");
            const senha = sessionStorage.getItem("senha");
            const cargo = sessionStorage.getItem("cargo");
            const cooperativaSessao = sessionStorage.getItem("cooperativa") || "";

            // APENAS TESOUREIRAS podem acessar esta página
            if (!user || !senha || cargo !== "tesoureira") {
                alert("Acesso restrito: Apenas Tesoureiras podem cadastrar cooperados.");
                window.location.href = "index.html";
                return;
            }

            // Selecionar cooperativa da tesoureira no select
            const coopSelect = document.getElementById("cooperativa");
            if (cooperativaSessao.toLowerCase().includes("santa")) {
                coopSelect.value = "santa maria";
            } else if (cooperativaSessao.toLowerCase().includes("coopersel")) {
                coopSelect.value = "coopersel";
            }

            // Botão voltar ao painel
            const btnVoltar = document.getElementById("btn-voltar");
            const btnCancelar = document.getElementById("btn-cancelar");

            function voltarAoPainel() {
                if (cooperativaSessao.toLowerCase().includes("santa")) {
                    window.location.href = "Santa Maria/dashboard.html";
                } else {
                    window.location.href = "Coopersel/dashboard.html";
                }
            }

            btnVoltar.addEventListener("click", voltarAoPainel);
            btnCancelar.addEventListener("click", voltarAoPainel);

            // Form Submit
            const form = document.getElementById("form-cadastrar-cooperado");
            const msgBox = document.getElementById("mensagem-container");
            const btnSubmit = document.getElementById("btn-submit");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                msgBox.classList.add("hidden");
                btnSubmit.disabled = true;
                btnSubmit.classList.add("opacity-50");

                const payload = {
                    nome: document.getElementById("nome").value.trim(),
                    cpf: document.getElementById("cpf").value.trim(),
                    rg: document.getElementById("rg").value.trim(),
                    idade: parseInt(document.getElementById("idade").value),
                    dt_nascimento: document.getElementById("dt_nascimento").value,
                    funcao: document.getElementById("funcao").value.trim(),
                    telefone: document.getElementById("telefone").value.trim(),
                    sexo: document.getElementById("sexo").value,
                    cooperativa: coopSelect.value,
                    endereco: document.getElementById("endereco").value.trim()
                };

                // Validações no Front
                if (payload.cpf.length !== 11) {
                    exibirMensagem("CPF deve conter exatamente 11 dígitos numéricos.", "erro");
                    btnSubmit.disabled = false;
                    btnSubmit.classList.remove("opacity-50");
                    return;
                }

                try {
                    const response = await fetch("https://backendcooperativas.vercel.app/adicionar_cooperado", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    const resData = await response.json();

                    if (!response.ok) {
                        throw new Error(resData.error || resData.details || "Erro ao cadastrar cooperado.");
                    }

                    exibirMensagem(resData.message || "Cooperado adicionado com sucesso!", "sucesso");
                    form.reset();
                    // Restaurar valor do select da cooperativa
                    if (cooperativaSessao.toLowerCase().includes("santa")) {
                        coopSelect.value = "santa maria";
                    } else if (cooperativaSessao.toLowerCase().includes("coopersel")) {
                        coopSelect.value = "coopersel";
                    }

                    setTimeout(() => {
                        voltarAoPainel();
                    }, 1800);

                } catch (err) {
                    exibirMensagem(err.message, "erro");
                } finally {
                    btnSubmit.disabled = false;
                    btnSubmit.classList.remove("opacity-50");
                }
            });

            function exibirMensagem(texto, tipo) {
                msgBox.textContent = texto;
                msgBox.classList.remove("hidden", "bg-green-100", "text-green-800", "bg-red-100", "text-red-800");
                if (tipo === "sucesso") {
                    msgBox.classList.add("bg-green-100", "text-green-800");
                } else {
                    msgBox.classList.add("bg-red-100", "text-red-800");
                }
            }
        });
    </script>
</body>

</html>
